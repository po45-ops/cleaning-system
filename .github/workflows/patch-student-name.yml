name: Patch student owner names

on:
  push:
    branches:
      - agent/add-student-name-to-passwords

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-student-name-to-passwords

      - name: Add student owner names
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/App.tsx")
          text = path.read_text(encoding="utf-8")

          old_credentials = '''  const [studentCredentials, setStudentCredentials] = useState(() => {
            const saved = localStorage.getItem("cleaning_student_creds");
            return saved ? JSON.parse(saved) : [{ id: "สภา01", password: "1234" }];
          });'''
          new_credentials = '''  const [studentCredentials, setStudentCredentials] = useState(() => {
            const saved = localStorage.getItem("cleaning_student_creds");
            const credentials = saved
              ? JSON.parse(saved)
              : [{ id: "สภา01", password: "1234", name: "" }];

            return credentials.map((credential) => ({
              ...credential,
              name: credential.name || "",
            }));
          });'''
          if old_credentials not in text:
              raise SystemExit("Student credential initializer was not found")
          text = text.replace(old_credentials, new_credentials, 1)

          old_login = '        onLogin({ role: "student", id: validUser.id });'
          new_login = '''        onLogin({
                  role: "student",
                  id: validUser.id,
                  name: validUser.name || "",
                });'''
          if old_login not in text:
              raise SystemExit("Student login handler was not found")
          text = text.replace(old_login, new_login, 1)

          old_badge = '''                    : `สภานักเรียน: ${user.id}`}'''
          new_badge = '''                    : `สภานักเรียน: ${
                        user.name ? `${user.name} (${user.id})` : user.id
                      }`}'''
          if old_badge not in text:
              raise SystemExit("Student account badge was not found")
          text = text.replace(old_badge, new_badge, 1)

          marker = "function UserManagement({ credentials, setCredentials }) {"
          if marker not in text:
              raise SystemExit("UserManagement component was not found")
          prefix = text.split(marker, 1)[0]
          user_management = r'''function UserManagement({ credentials, setCredentials }) {
            const [newId, setNewId] = useState("");
            const [newPassword, setNewPassword] = useState("");
            const [newName, setNewName] = useState("");
            const [message, setMessage] = useState("");

            const handleAddUser = (e) => {
              e.preventDefault();
              if (!newId.trim() || !newPassword.trim() || !newName.trim())
                return alert("กรุณากรอก Username, Password และชื่อนักเรียนให้ครบ");
              if (credentials.find((c) => c.id === newId.trim()))
                return alert("มีบัญชีนี้แล้ว");
              setCredentials([
                ...credentials,
                {
                  id: newId.trim(),
                  password: newPassword.trim(),
                  name: newName.trim(),
                },
              ]);
              setNewId("");
              setNewPassword("");
              setNewName("");
              setMessage("เพิ่มบัญชีสำเร็จ");
              setTimeout(() => setMessage(""), 2000);
            };

            const handleNameChange = (id, name) => {
              setCredentials(
                credentials.map((credential) =>
                  credential.id === id ? { ...credential, name } : credential
                )
              );
            };

            return (
              <div className="space-y-6">
                <div className="bg-white rounded-xl shadow-sm border p-6 print:hidden">
                  <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
                    <h2 className="text-xl font-bold flex items-center gap-2">
                      <UserPlus className="text-emerald-600" /> จัดการรหัสผ่านสภานักเรียน
                    </h2>
                    {message && (
                      <span className="text-sm font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 px-3 py-1.5 rounded-lg">
                        {message}
                      </span>
                    )}
                  </div>

                  <form
                    onSubmit={handleAddUser}
                    className="grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-50 p-4 rounded-xl mb-4 items-end"
                  >
                    <div>
                      <label className="block text-xs font-bold mb-1">Username</label>
                      <input
                        type="text"
                        value={newId}
                        onChange={(e) => setNewId(e.target.value)}
                        className="w-full p-2 border rounded"
                        placeholder="เช่น สภา02"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold mb-1">Password</label>
                      <input
                        type="text"
                        value={newPassword}
                        onChange={(e) => setNewPassword(e.target.value)}
                        className="w-full p-2 border rounded"
                        placeholder="รหัสผ่าน"
                      />
                    </div>
                    <div className="md:col-span-2">
                      <label className="block text-xs font-bold mb-1">
                        รายชื่อนักเรียน / ผู้รับผิดชอบบัญชี
                      </label>
                      <input
                        type="text"
                        value={newName}
                        onChange={(e) => setNewName(e.target.value)}
                        className="w-full p-2 border rounded"
                        placeholder="กรอกชื่อ–นามสกุลนักเรียน เพื่อระบุว่าเป็นงานของใคร"
                      />
                    </div>
                    <button
                      type="submit"
                      className="md:col-span-2 w-full bg-emerald-600 hover:bg-emerald-700 text-white p-2.5 px-6 rounded font-bold transition-colors"
                    >
                      เพิ่มบัญชี
                    </button>
                  </form>

                  <div className="overflow-x-auto rounded-lg border">
                    <table className="w-full min-w-[780px] text-left bg-white">
                      <thead>
                        <tr className="bg-slate-100">
                          <th className="p-3">ลำดับ</th>
                          <th className="p-3">Username</th>
                          <th className="p-3">Password</th>
                          <th className="p-3">ชื่อนักเรียน / ผู้รับผิดชอบ</th>
                          <th className="p-3 text-center">ลบ</th>
                        </tr>
                      </thead>
                      <tbody>
                        {credentials.map((c, i) => (
                          <tr key={c.id} className="border-b last:border-b-0">
                            <td className="p-3">{i + 1}</td>
                            <td className="p-3 font-bold">{c.id}</td>
                            <td className="p-3">
                              <span className="bg-slate-100 px-2 py-1 rounded">
                                {c.password}
                              </span>
                            </td>
                            <td className="p-3">
                              <input
                                type="text"
                                value={c.name || ""}
                                onChange={(e) => handleNameChange(c.id, e.target.value)}
                                className="w-full min-w-[240px] p-2 border rounded-lg bg-white focus:ring-2 focus:ring-emerald-500 outline-none"
                                placeholder="กรอกชื่อเจ้าของบัญชี"
                                aria-label={`ชื่อนักเรียนของบัญชี ${c.id}`}
                              />
                            </td>
                            <td className="p-3 text-center">
                              <button
                                type="button"
                                onClick={() =>
                                  setCredentials(
                                    credentials.filter((u) => u.id !== c.id)
                                  )
                                }
                                className="text-red-500 hover:text-red-700 p-2"
                                aria-label={`ลบบัญชี ${c.id}`}
                              >
                                <Trash2 className="w-4 h-4" />
                              </button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>

                  <p className="mt-3 text-sm text-slate-500">
                    สามารถกรอกหรือแก้ไขชื่อนักเรียนในตารางได้ทันที ระบบจะบันทึกชื่อไว้กับ Username และ Password โดยอัตโนมัติ
                  </p>
                </div>
              </div>
            );
          }
          '''

          path.write_text(prefix + user_management, encoding="utf-8")
          PY

      - name: Verify production build
        shell: bash
        run: |
          npm install --legacy-peer-deps
          CI=false npm run build

      - name: Commit application change
        shell: bash
        run: |
          rm .github/workflows/patch-student-name.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx .github/workflows/patch-student-name.yml
          git commit -m "add student names to password accounts"
          git push origin HEAD:agent/add-student-name-to-passwords
