name: One-time direct Apps Script URL fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-script-url:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace Apps Script URL directly in App.tsx
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          old = 'https://script.google.com/macros/s/AKfycbyTSx3ggaJfXtYd_rQ67FoI5pPb8y_LXcTAm6RiSnkf34uiZL5GZBStGVMXyGCHQ5JfEA/exec'
          new = 'https://script.google.com/macros/s/AKfycbwfmqSlIqJ0-2CoAQ1Uv7nrL47x3zsqToUWP0brNiHBnJGFIvz450w33ANBmltvOjNPTg/exec'

          text = path.read_text(encoding='utf-8')
          if old not in text:
              raise SystemExit('Old Apps Script URL not found in src/App.tsx')
          path.write_text(text.replace(old, new), encoding='utf-8')

          workflow = Path('.github/workflows/one-time-direct-script-url.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit direct URL change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx .github/workflows/one-time-direct-script-url.yml
          git commit -m "Use current Apps Script URL directly in app"
          git push origin HEAD:main
