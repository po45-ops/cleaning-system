name: Deploy React app to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run tests
        run: npm test

      - name: Build React app
        run: npm run build

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      actions: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      # This repository still has the legacy branch-based Pages publisher enabled.
      # Let it finish first so the Vite artifact below is always the final deploy.
      - name: Wait for legacy Pages deployment
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          missing_count=0
          for attempt in $(seq 1 60); do
            status="$(
              gh api --method GET \
                "/repos/${GITHUB_REPOSITORY}/actions/runs" \
                -f head_sha="${GITHUB_SHA}" \
                -f event=dynamic \
                -f per_page=10 \
                --jq '.workflow_runs | map(select(.name == "pages build and deployment")) | first | .status // "missing"'
            )"

            if [ "${status}" = "completed" ]; then
              echo "Legacy Pages deployment completed; deploying the Vite build next."
              break
            fi

            if [ "${status}" = "missing" ]; then
              missing_count=$((missing_count + 1))
              if [ "${missing_count}" -ge 3 ]; then
                echo "No legacy Pages deployment found; continuing."
                break
              fi
            else
              missing_count=0
              echo "Legacy Pages deployment status: ${status}"
            fi

            if [ "${attempt}" -eq 60 ]; then
              echo "Timed out waiting for the legacy deployment; continuing with Vite."
              break
            fi
            sleep 5
          done

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
