<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10b981" />
    <title>ระบบตรวจเวรทำความสะอาด</title>

    <!-- ดึง Tailwind CSS มาใช้งาน -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      /* จัดหัวตารางให้อยู่กึ่งกลางเซลล์ และชดเชยฐานตัวอักษรภาษาไทยที่ดูต่ำ */
      .formal-report-table thead tr {
        height: 52px !important;
      }

      .formal-report-table thead th {
        vertical-align: middle !important;
        text-align: center !important;
        line-height: 1.15 !important;
        padding-top: 7px !important;
        padding-bottom: 15px !important;
        padding-left: 8px !important;
        padding-right: 8px !important;
      }

      .formal-report-table th,
      .formal-report-table td {
        vertical-align: middle !important;
      }

      @media print {
        .formal-report-table thead tr {
          height: 50px !important;
        }

        .formal-report-table thead th {
          line-height: 1.15 !important;
          padding-top: 6px !important;
          padding-bottom: 14px !important;
          padding-left: 7px !important;
          padding-right: 7px !important;
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
